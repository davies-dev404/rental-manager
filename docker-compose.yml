# ==============================================================================
# MakaziFlow Production Docker Compose Stack
# Multi-container Architecture:
#   - Nginx  (Reverse Proxy / SSL Termination)
#   - Frontend (Vite / React / Nginx static)
#   - Backend (Node.js / Express REST API + GraphQL)
#   - Redis   (Cache & Pub/Sub)
#   - Kafka   (Event Streaming) + Zookeeper
#   - RabbitMQ (Message Broker / Task Queues)
#   - Elasticsearch + Kibana (Search & Analytics)
#   - MongoDB (Optional Local Dev or points to Mongo Atlas)
# ==============================================================================

version: '3.8'

services:
  # ─── 1. NGINX REVERSE PROXY ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: makaziflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - client
      - server
    networks:
      - makaziflow_network

  # ─── 2. FRONTEND SERVICE ──────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: makaziflow_client
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - server
    networks:
      - makaziflow_network

  # ─── 3. BACKEND API SERVICE ───────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: makaziflow_server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - RABBITMQ_URL=amqp://makaziflow:makaziflow_pass@rabbitmq:5672
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - redis
      - kafka
      - rabbitmq
      - elasticsearch
    networks:
      - makaziflow_network

  # ─── 4. REDIS CACHE & EVENT QUEUE ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: makaziflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - makaziflow_network

  # ─── 5. ZOOKEEPER FOR KAFKA ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: makaziflow_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - makaziflow_network

  # ─── 6. APACHE KAFKA MESSAGE BROKER ───────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: makaziflow_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - makaziflow_network

  # ─── 7. RABBITMQ MESSAGE BROKER ───────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: makaziflow_rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: makaziflow
      RABBITMQ_DEFAULT_PASS: makaziflow_pass
      RABBITMQ_DEFAULT_VHOST: makaziflow_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - makaziflow_network

  # ─── 8. ELASTICSEARCH (Search & Analytics) ────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: makaziflow_elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false       # Disable for local dev; enable in prod
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=makaziflow_es
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - makaziflow_network

  # ─── 9. KIBANA (Elasticsearch Visualiser - Dev Only) ──────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: makaziflow_kibana
    restart: always
    ports:
      - "5601:5601"     # Kibana UI → http://localhost:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - makaziflow_network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  makaziflow_network:
    driver: bridge

# ==============================================================================
# MakaziFlow Local & Containerized Stack
# Matches actual production architecture:
# - client: React + Vite served via Nginx
# - server: Node.js + Express + Socket.IO modular monolith
# - mongodb: MongoDB 7 (Replica Set / Local Dev)
# - redis: Optional Redis 7 for caching, BullMQ & distributed locks
# - worker: Optional BullMQ background worker (profile: worker)
# ==============================================================================

services:
  mongodb:
    image: mongo:7
    container_name: makaziflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makaziflow_network

  redis:
    image: redis:7-alpine
    container_name: makaziflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makaziflow_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: makaziflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/rental_manager_dev
      - REDIS_URL=redis://redis:6379
      - ENABLE_SOCKET_IO=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - makaziflow_network

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: makaziflow_worker
    profiles: ["worker"]
    command: ["node", "worker.js"]
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/rental_manager_dev
      - REDIS_URL=redis://redis:6379
      - ENABLE_BULLMQ_WORKERS=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - makaziflow_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: makaziflow_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - makaziflow_network

volumes:
  mongo_data:
  redis_data:

networks:
  makaziflow_network:
    driver: bridge

# ==============================================================================
# MakaziFlow Kubernetes (K8s) Manifests
# Architecture:
# - Namespace: makaziflow
# - Deployments: Frontend (Client), Backend (API), Redis, Kafka & Zookeeper
# - Services: ClusterIP & Ingress / LoadBalancer
# - ConfigMaps & Secrets
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: makaziflow
---
# ─── REDIS DEPLOYMENT & SERVICE ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: makaziflow
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# ─── ZOOKEEPER & KAFKA DEPLOYMENTS ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: makaziflow
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: makaziflow
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
---
# ─── BACKEND API SERVER DEPLOYMENT ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: makaziflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: makaziflow/server:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: jwt-secret
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: makaziflow
spec:
  selector:
    app: server
  ports:
  - port: 5000
    targetPort: 5000
---
# ─── FRONTEND CLIENT DEPLOYMENT ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: makaziflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: makaziflow/client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: makaziflow
spec:
  type: LoadBalancer
  selector:
    app: client
  ports:
  - port: 80
    targetPort: 80

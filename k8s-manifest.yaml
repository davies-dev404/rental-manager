# ==============================================================================
# MakaziFlow Kubernetes (K8s) Manifests
# Architecture:
# - Namespace: makaziflow
# - Deployments: Nginx, Frontend, Backend, Redis, Kafka, RabbitMQ, Elasticsearch
# - Services: ClusterIP, LoadBalancer, Ingress
# - ConfigMaps & Secrets
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: makaziflow
---
# ─── REDIS DEPLOYMENT & SERVICE ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: makaziflow
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# ─── ZOOKEEPER & KAFKA DEPLOYMENTS ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: makaziflow
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: makaziflow
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
---
# ─── RABBITMQ DEPLOYMENT & SERVICE ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: makaziflow
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          value: makaziflow_vhost
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: makaziflow
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
# ─── ELASTICSEARCH DEPLOYMENT & SERVICE ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-deployment
  namespace: makaziflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        ports:
        - containerPort: 9200
        - containerPort: 9300
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: makaziflow
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
---
# ─── BACKEND API SERVER DEPLOYMENT ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: makaziflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: makaziflow/server:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: RABBITMQ_URL
          value: "amqp://makaziflow:$(RABBITMQ_PASS)@rabbitmq-service:5672/makaziflow_vhost"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: rabbitmq-pass
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: makaziflow-secrets
              key: jwt-secret
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: makaziflow
spec:
  selector:
    app: server
  ports:
  - port: 5000
    targetPort: 5000
---
# ─── FRONTEND CLIENT DEPLOYMENT ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: makaziflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: makaziflow/client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: makaziflow
spec:
  type: LoadBalancer
  selector:
    app: client
  ports:
  - port: 80
    targetPort: 80
---
# ─── NGINX INGRESS CONTROLLER ────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: makaziflow-ingress
  namespace: makaziflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: server-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-service
            port:
              number: 80
---
# ─── SECRETS TEMPLATE (replace values before applying) ───────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: makaziflow-secrets
  namespace: makaziflow
type: Opaque
stringData:
  mongodb-uri: "mongodb+srv://USER:PASS@cluster.mongodb.net/makaziflow"
  jwt-secret: "change-me-to-a-strong-secret-key-in-production"
  rabbitmq-pass: "makaziflow_pass"
---

---
deployment:
  tasks:
    # -------------------------------------------------------------
    # MakaziFlow cPanel Git Deployment Configuration
    # Deploys to the makaziflow.afrinextech.co.ke subdomain folder
    # (Never overwrite main public_html which belongs to afrinextech.co.ke)
    # -------------------------------------------------------------
    - export DEPLOYPATH=${DEPLOYPATH:-/home/$(whoami)/makaziflow.afrinextech.co.ke/}
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -a client/dist/. $DEPLOYPATH
    - /bin/cp client/public/.htaccess $DEPLOYPATH 2>/dev/null || true
